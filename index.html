     su tablet (griglia indice 2 colonne, apertura diretta del progetto) e
     vanno decisi in JS, non solo con CSS */
  function isTabletViewport(){
    return window.matchMedia("(min-width:801px) and (max-width:1279px)").matches;
  }
  function isMobileViewport(){
    return window.matchMedia("(max-width:800px)").matches;
  }
  /* usata per capire, dopo un resize/rotazione, se si è passati da un
     "bucket" all'altro (mobile/tablet/desktop) — vedi il resize handler
     più sotto, che ricostruisce la griglia indice solo quando serve */
  function viewportBucket(){
    if(isMobileViewport()) return "mobile";
    if(isTabletViewport()) return "tablet";
    return "desktop";
  }

  /* video "pigri": niente autoplay in HTML (che li farebbe partire tutti
     insieme appena inseriti nel DOM, anche fuori schermo — il vero
     collo di bottiglia su mobile con più gallerie inline aperte insieme).
     Un solo IntersectionObserver condiviso si occupa di avviarli quando
     entrano in vista e metterli in pausa quando escono: al massimo 1-2
     video attivi alla volta invece di tutti insieme. preload="none" li
     lascia scaricare solo al momento del play, non prima. */
  const lazyVideoObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const video = entry.target;
      if(entry.isIntersecting){
        if(video.preload === "none") video.preload = "auto";
        video.play().catch(()=>{}); /* i browser possono rifiutare il play se non ancora pronto: si riprova al frame successivo grazie all'observer stesso */
      } else {
        video.pause();
      }
    });
  }, { rootMargin:"200px 0px", threshold:0.25 });

  function observeLazyVideos(root){
    root.querySelectorAll("video[data-lazy-video]").forEach(video=>{
      lazyVideoObserver.observe(video);
    });
  }

  /* click su un pallino: dissolvenza invece di uno scorrimento visibile —
     il contenuto sfuma a 0, lo scroll salta di scatto alla nuova posizione
     mentre è invisibile, poi risfuma a 1. L'assegnazione a scrollTop va
     comunque fatta con scroll-behavior:auto forzato: #projects-list ha
     scroll-behavior:smooth in CSS, e un'assegnazione diretta lì lancerebbe
     una sua animazione nativa che non avrebbe il tempo di finire nella
     finestra (invisibile) in cui deve scattare */
  function dissolveScrollTo(el, { top, left }, fadeDuration = 200){
    const prevTransition = el.style.transition;
    const prevScrollBehavior = el.style.scrollBehavior;
    el.style.transition = `opacity ${fadeDuration}ms ease`;
    el.style.opacity = "0";
    setTimeout(()=>{
      el.style.scrollBehavior = "auto";
      if(top !== undefined) el.scrollTop = top;
      if(left !== undefined) el.scrollLeft = left;
      el.style.scrollBehavior = prevScrollBehavior;
      requestAnimationFrame(()=>{
        el.style.opacity = "1";
        setTimeout(()=>{ el.style.transition = prevTransition; }, fadeDuration);
      });
    }, fadeDuration);
  }

  /* ============================================================
     INTRO SPLASH

  const introScreen = document.getElementById("intro-screen");
  const introEnter = document.getElementById("intro-enter");
  const introLogo = document.getElementById("intro-logo");
  const introPlaceholder = document.getElementById("intro-logo-placeholder");

  function revealIntroLogo(){

    introPlaceholder.style.display = "none";

  function hideIntroLogo(){

  introLogo.addEventListener("load", revealIntroLogo);
  introLogo.addEventListener("error", hideIntroLogo);
  if(introLogo.complete){
    introLogo.naturalWidth > 0 ? revealIntroLogo() : hideIntroLogo();
  }

  introScreen.addEventListener("click", ()=>{
    introScreen.classList.add("fade-out");
    setTimeout(()=>{ introScreen.style.display = "none"; }, 600);
  });

  /* ============================================================
     NAVIGAZIONE
     ============================================================ */
  let activeFilter = "all";

  /* "grid": indice di tutti i progetti del filtro corrente (titolo + tag,
     copertina all'hover). "list": la scheda singola già esistente
     (descrizione, more info, view project), aperta cliccando un progetto
     dell'indice — si scorre ancora tra le schede come prima una volta lì */
  let projectsMode = "grid";

  /* true dopo la prima renderProjectsList() riuscita: serve a showView()
     per capire se può riusare la lista già costruita invece di rifarla
     da zero (vedi sotto — è lì il vero motivo del lag al click sul tab
     Projects) */
  let projectsListReady = false;

  /* il cursore potrebbe già trovarsi fermo sopra un riquadro quando la
     griglia appare (prima visita, cambio filtro, ritorno da un progetto):
     senza questo accorgimento l'hover CSS scatterebbe subito, rivelando
     l'anteprima senza che l'utente abbia davvero mosso il mouse. Non basta
     però "un qualunque movimento" (anche solo un tremolio dentro lo stesso
     riquadro rivelerebbe comunque quello): serve che il cursore passi
     davvero a un riquadro diverso (o allo spazio vuoto) da quello in cui
     si trovava al primo movimento rilevato. La classe .hover-ready si
     aggiunge solo a quel punto (vedi CSS, .projects-index-grid.hover-ready)
     e resta valida per il resto della visita alla griglia. */
  function armGridHoverGate(){
    const grid = document.getElementById("projects-index-grid");
    grid.classList.remove("hover-ready");
    let restingTile; // undefined = non ancora rilevato
    function onMove(e){
      const tile = e.target.closest(".index-tile") || null;
      if(restingTile === undefined){
        restingTile = tile;
        return;
      }
      if(tile !== restingTile){
        grid.classList.add("hover-ready");
        grid.removeEventListener("mousemove", onMove);
      }
    }
    grid.addEventListener("mousemove", onMove);
  }

  function applyProjectsMode(){
    const view = document.getElementById("view-projects");
    view.classList.toggle("grid-mode", projectsMode === "grid");
    view.classList.toggle("list-mode", projectsMode === "list");
    if(projectsMode === "grid"){
      armGridHoverGate();
      /* si torna sempre all'elenco con lo scorrimento in cima, non dove
         l'utente l'aveva eventualmente lasciato l'ultima volta (solo
         mobile, l'indice a griglia desktop non scorre) */
      document.getElementById("projects-index-list").scrollTop = 0;
    }
  }

  /* Costruisce la galleria inline di UN solo progetto, solo la prima volta
     che quella scheda diventa "corrente" su mobile (vedi enterProjectRow).
     Prima, renderProjectsList() costruiva le gallerie di TUTTI e 8 i
     progetti a ogni render — su desktop sprecato al 100% (quel div resta
     sempre display:none, la vista Detail ha la sua galleria separata), su
     mobile utile solo per il singolo progetto aperto in quel momento. Ora
     il lavoro (string building, parsing, listener del lightbox, video da
     osservare) si fa una sola volta per progetto, solo quando serve
     davvero — idempotente via data-built, per non rifarlo se si rientra
     nella stessa scheda più volte. */
  function populateProjectRowGallery(id){
    const project = PROJECTS.find(p => p.id === id);
    if(!project) return;
    const galleryEl = document.querySelector(`#projects-list .project-row-gallery[data-project="${id}"]`);
    if(!galleryEl || galleryEl.dataset.built) return;
    galleryEl.dataset.built = "1";
    galleryEl.innerHTML = buildGalleryItemsHtml(project).join("");
    const triggers = [...galleryEl.querySelectorAll(".gallery-item[data-src]")];
    const items = triggers.map(item => ({ src: item.dataset.src, caption: item.dataset.caption }));
    triggers.forEach((item, i)=>{
      item.addEventListener("click", ()=>{
        lightboxItems = items;
        openLightbox(i);
      });
    });
    observeLazyVideos(galleryEl);
  }

  function enterProjectRow(id, pushState = true){
    projectsMode = "list";
    applyProjectsMode();
    const container = document.getElementById("projects-list");
    const row = container.querySelector(`.project-row[data-project="${id}"]`);
    /* su mobile non si scorre più in orizzontale tra i progetti (vedi
       mobile.css): si vede solo la scheda "corrente", le altre restano
       fuori dal flusso. Su desktop questa classe non ha alcun effetto
       visivo (lì si scorre ancora in verticale, vedi scrollIntoView) */
    container.querySelectorAll(".project-row").forEach(r=> r.classList.toggle("current", r === row));
    /* la galleria inline serve solo su mobile (su desktop .project-row-gallery
       è sempre display:none): costruirla anche su desktop sarebbe lavoro
       sprecato ad ogni apertura di scheda */
    if(window.matchMedia("(max-width:800px)").matches){
      populateProjectRowGallery(id);
    }
    row?.scrollIntoView({ behavior:"instant", block:"start", inline:"start" });
    if(pushState) pushNavState("projects");
  }

  function exitToGrid(pushState = true){
    projectsMode = "grid";
    applyProjectsMode();
    if(pushState) pushNavState("projects");
  }

  function showView(name, keepProjectsState = false){
    const current = document.querySelector(".view.active");
    const next = document.querySelector(`.view[data-view="${name}"]`);
    if(!next || next === current) return;

    next.classList.add("active");

    if(name === "projects" && !keepProjectsState){
      /* si riparte dall'indice a griglia nel filtro "all" solo quando si entra
         in Projects dal menu/tab; tornando indietro da un progetto (back-btn
         o titolo) si resta invece sul filtro e sulla scheda di provenienza */
      /* la lista va ricostruita solo se lo stato precedente non era già
         quello di default (filtro "all" + griglia) o se non è mai stata
         costruita: prima questo blocco rifaceva SEMPRE tutta la lista —
         fino a 80 foto/video nelle gallerie inline — a ogni singolo tap sul
         tab Projects, anche quando il contenuto sarebbe rimasto identico.
         Era il costo maggiore del lag percepito al click. */
      const needsRebuild = !projectsListReady || activeFilter !== "all" || projectsMode !== "grid";
      activeFilter = "all";
      projectsMode = "grid";
      if(needsRebuild){
        applyProjectsMode();
        renderFilters();
        renderProjectsList();
        projectsListReady = true;
      }
      document.getElementById("projects-list").scrollTo({top:0, left:0, behavior:"instant"});
    }

    void next.offsetWidth;
    next.classList.add("visible");

    if(current){
      current.classList.remove("visible");
      current.addEventListener("transitionend", function cleanup(e){
        if(e.propertyName !== "opacity") return;
        current.removeEventListener("transitionend", cleanup);
        /* le view sono riusate per ogni progetto (un solo #view-detail):
           se nel frattempo current è stata riattivata (es. utente tornato
           qui prima che questa dissolvenza in uscita finisse), "visible"
           è già stata rimessa — in quel caso NON va tolta "active",
           altrimenti la view resterebbe display:none pur essendo quella
           corrente (clientWidth/Height a 0, griglia rotta) */
        if(!current.classList.contains("visible")){
          current.classList.remove("active");
        }
      });
    }
  }

  /* stato completo da salvare nella cronologia del browser: non solo quale
     sezione è visibile, ma anche filtro/modalità griglia-scheda e quale
     progetto — altrimenti i tasti avanti/indietro del browser potrebbero
     solo riattivare la sezione "Projects" o "Detail" senza sapere più con
     quale progetto o filtro, mostrando contenuti non coerenti con quel
     passo della cronologia (es. la scheda di un altro progetto rimasta
     da prima) */
  function currentNavState(name){
    return {
      view: name,
      filter: activeFilter,
      mode: projectsMode,
      listProject: document.querySelector(".project-row.current")?.dataset.project || null,
      detailProject: document.getElementById("view-detail").dataset.project || null,
    };
  }
  function pushNavState(name){
    const hash = name === "home" ? "" : "#" + name;
    history.pushState(currentNavState(name), "", hash || location.pathname);
  }

  function navigate(name, pushState = true, keepProjectsState = false){
    showView(name, keepProjectsState);
    if(pushState) pushNavState(name);
  }

  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", () => {
      /* back-btn e titolo dentro la vista Detail tornano a Projects
         mantenendo filtro e scroll; ogni altro trigger (tab, logo, ecc.)
         riparte invece dal primo progetto in "all" */
      const fromDetail = el.dataset.nav === "projects" && !!el.closest('.view[data-view="detail"]');
      /* back-btn/titolo dentro Projects, mentre si guarda una scheda: un
         passo indietro torna all'indice a griglia invece di uscire da
         Projects del tutto */
      const fromProjectsRow = el.dataset.nav === "home" && projectsMode === "list"
        && !!el.closest('.view[data-view="projects"]');
      if(fromProjectsRow){ exitToGrid(); return; }
      navigate(el.dataset.nav, true, fromDetail);
    });
  });

  /* ricostruisce lo stato esatto invece di limitarsi a riattivare la
     sezione: filtro, modalità griglia/scheda e progetto (lista o
     dettaglio) vengono rimessi com'erano a quel passo della cronologia,
     PRIMA di rendere la sezione visibile — altrimenti si vedrebbe per un
     istante il contenuto vecchio (es. la scheda di un altro progetto) */
  window.addEventListener("popstate", (e)=>{
    const state = e.state || { view:"home" };
    const name = state.view || "home";

    if(name === "projects"){
      activeFilter = state.filter || "all";
      projectsMode = state.mode || "grid";
      renderFilters();
      renderProjectsList();
      applyProjectsMode();
      if(projectsMode === "list" && state.listProject){
        enterProjectRow(state.listProject, false);
      }
    } else if(name === "detail" && state.detailProject){
      openProject(state.detailProject, false);
    }

    showView(name, true);
  });

  /* ============================================================
     RENDER: FILTRI + LISTA PROGETTI
     ============================================================ */
  function renderFilters(){
    const categories = ["all", "Brand Identity", "Content Strategy"];
    const container = document.getElementById("filters");
    container.innerHTML = categories.map(cat => {
      const label = cat === "all" ? "All" : cat;
      const isActive = cat === activeFilter;
      return `
        <div class="filter-item${isActive ? " active" : ""}">
          <button class="filter-btn ${isActive ? "active" : ""}" data-filter="${cat}"><span class="filter-label" data-label="${label}">${label}</span></button>
        </div>`;
    }).join("");

    container.querySelectorAll(".filter-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        activeFilter = btn.dataset.filter;
        /* cambiare filtro torna sempre all'indice a griglia: la scheda che
           si stava eventualmente guardando potrebbe non esistere più nel
           nuovo filtro */
        projectsMode = "grid";
        applyProjectsMode();
        renderFilters();
        renderProjectsList();
        const list = document.getElementById("projects-list");
        /* scrollTo(..., "instant") invece di scrollTop/scrollLeft = 0: subito
           dopo aver ricostruito la lista, l'assegnazione diretta a scrollTop
           viene ignorata da Chrome perché scroll-behavior:smooth la tratta
           come un'animazione che qui non parte mai (bug del browser) */
        list.scrollTo({top:0, left:0, behavior:"instant"});
        /* ogni cambio filtro è un passo a sé nella cronologia: i tasti
           avanti/indietro del browser devono poter tornare al filtro
           precedente, non solo alla sezione */
        pushNavState("projects");
      });
    });
  }

  /* indice a griglia: sempre 2 righe, le colonne si adattano al numero di
     progetti del filtro corrente (in "All" con 8 progetti: 4 colonne).
     Titolo in alto a sinistra, frase riassuntiva sotto (la stessa usata
     in mobile al posto dei tag) e un solo tag, ancorato in fondo al
     riquadro (vedi CSS, .index-tile-tags{margin-top:auto}) e staccato dal
     blocco titolo/frasetta. La copertina riempie tutto il riquadro al
     passaggio del cursore (vedi CSS, .index-tile:hover .index-tile-cover),
     momento in cui titolo, frasetta e tag scompaiono tutti e resta
     visibile solo la copertina. Un click apre la scheda già esistente su
     quel progetto specifico */
  function renderProjectsIndexGrid(list){
    const grid = document.getElementById("projects-index-grid");
    /* Desktop: righe fisse a 2, colonne che si adattano (comportamento
       originale). Tablet: rapporto invertito — colonne fisse a 2, righe
       che si adattano (es. "All" con 8 progetti = 4 righe x 2 colonne;
       un filtro con 3 progetti = 2 righe x 2 colonne, l'ultima incompleta) */
    const tablet = isTabletViewport();
    const rows = tablet ? Math.max(1, Math.ceil(list.length / 2)) : 2;
    const cols = tablet ? 2 : Math.max(1, Math.ceil(list.length / rows));
    grid.style.setProperty("--index-grid-cols", cols);
    grid.style.setProperty("--index-grid-rows", rows);
    grid.innerHTML = list.map((p, i) => {
      const classes = ["index-tile"];
      const rowIndex = Math.floor(i / cols);
      /* riga interna (non l'ultima): le separa dalla riga sotto — sulla
         riga finale non serve, non c'è nulla sotto con cui confondersi
         (vedi CSS .index-tile-top-row) */
      if(rowIndex < rows - 1) classes.push("index-tile-top-row");
      /* ultima colonna vera (indice di colonna cols-1): è l'unica che
         tocca sempre il bordo destro dello schermo, quindi niente
         border-right lì (vedi CSS). Se una riga è incompleta (l'ultimo
         progetto non arriva fino all'ultima colonna, es. 5 progetti su
         3 colonne) quel progetto NON è in questa colonna e mantiene il
         bordo, perché a destra ha spazio vuoto, non il bordo schermo */
      if(i % cols === cols - 1) classes.push("index-tile-last-col");
      return `
      <div class="${classes.join(" ")}" data-project="${p.id}">
        ${p.cover ? `<div class="index-tile-cover"><img src="${encodePath(p.cover)}" alt="" loading="lazy"></div>` : ""}
        <div class="index-tile-info">
          <span class="index-tile-title">${p.name}</span>
          <p class="index-tile-blurb">${p.blurb}</p>
        </div>
        <div class="index-tile-tags">
          <span class="index-tile-tag">${p.tags[0] || ""}</span>
        </div>
      </div>
    `;
    }).join("");
    grid.querySelectorAll(".index-tile").forEach(tile=>{
      tile.addEventListener("click", ()=>{
        /* Tablet: niente scheda intermedia con "View Project" — si apre
           subito la galleria del progetto, come su smartphone, ma
           restando nella pagina di dettaglio "vera" (che ha ancora il
           toggle Scroll/Grid, a differenza della versione mobile) */
        if(isTabletViewport()){
          openProject(tile.dataset.project);
        } else {
          enterProjectRow(tile.dataset.project);
        }
      });
    });
  }

  /* versione mobile dell'indice progetti: fasce semplici (titolo, tag
     sotto e freccetta a destra) invece della griglia — vedi mobile.css,
     che nasconde .projects-index-grid e mostra questa sotto gli 800px.
     Stesso comportamento al click: apre direttamente la scheda del
     progetto */
  function renderProjectsIndexList(list){
    const wrap = document.getElementById("projects-index-list");
    wrap.innerHTML = list.map(p => `
      <div class="index-row" data-project="${p.id}" data-cover="${p.cover || ""}">
        <div class="index-row-text">
          <span class="index-row-title">${p.name}</span>
          <span class="index-row-tag">${p.tags[0] || ""}</span>
        </div>
        <span class="index-row-arrow"><svg class="icon-svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="m321-80-71-71 329-329-329-329 71-71 400 400L321-80Z"/></svg></span>
      </div>
    `).join("");
    wrap.querySelectorAll(".index-row").forEach(row=>{
      row.addEventListener("click", ()=>{
        /* la pressione prolungata apre solo l'anteprima (vedi
           setupIndexRowLongPress): non deve anche far scattare la
           navigazione quando il dito si solleva */
        if(row.dataset.longPressed){ delete row.dataset.longPressed; return; }
        enterProjectRow(row.dataset.project);
      });
      setupIndexRowLongPress(row);
    });
  }

  /* tenere premuto su una fascia dell'elenco (mobile): mostra un'anteprima
     della copertina del progetto, stesso spirito dell'anteprima al passaggio
     del mouse nella griglia desktop ma adattata al touch (che non ha hover).
     Un tap rapido continua a navigare come prima; solo se il dito resta
     fermo abbastanza a lungo scatta l'anteprima, e in quel caso il tap
     successivo NON deve anche navigare (vedi flag row.dataset.longPressed) */
  const LONG_PRESS_MS = 380;
  function setupIndexRowLongPress(row){
    let timer = null;
    const preview = document.getElementById("mobile-row-preview");
    const previewImg = document.getElementById("mobile-row-preview-img");
    const clearTimer = () => { clearTimeout(timer); timer = null; };
    const hide = () => preview.classList.remove("active");
    row.addEventListener("touchstart", (e)=>{
      if(e.touches.length !== 1) return;
      const cover = row.dataset.cover;
      if(!cover) return;
      clearTimer();
      timer = setTimeout(()=>{
        row.dataset.longPressed = "1";
        previewImg.src = encodePath(cover);
        preview.classList.add("active");
        /* feedback tattile leggero, se il dispositivo lo supporta */
        if(navigator.vibrate) navigator.vibrate(12);
      }, LONG_PRESS_MS);
    }, { passive:true });
    /* un dito che si muove è uno scroll della lista, non una pressione
       ferma: annulla il timer prima che scatti l'anteprima */
    row.addEventListener("touchmove", clearTimer, { passive:true });
    row.addEventListener("touchend", ()=>{ clearTimer(); hide(); });
    row.addEventListener("touchcancel", ()=>{ clearTimer(); hide(); });
  }

  function renderProjectsList(){
    const list = PROJECTS.filter(p => activeFilter === "all" || p.categories.includes(activeFilter));
    const container = document.getElementById("projects-list");

    renderProjectsIndexGrid(list);
    renderProjectsIndexList(list);

    document.getElementById("project-dots").innerHTML =
      list.map((p, i) => `<span class="project-dot${i === 0 ? " active" : ""}" data-title="${p.name}"></span>`).join("");

    container.innerHTML = list.map(p => {
      const moreFields = [
        ["Year", p.year],
        ["Client", p.client],
        ["Team", p.team.join(", ")]
      ].filter(([,value]) => value);
      return `
      <div class="project-row" data-project="${p.id}">
        <div class="project-row-text">
          <div class="project-row-main">
            <span class="project-row-title">${p.name}</span>
            <p class="project-row-blurb">${p.blurb}</p>
            <p class="project-row-more-desc">${p.description}</p>
            <ul class="project-row-tags">${p.tags.map(t => `<li>${t}</li>`).join("")}</ul>
            <div class="project-row-more">
              <button class="project-row-more-toggle">
                <span class="more-info-label"><span class="more-info-prefix">More </span>Info</span>
                <svg class="icon-svg" viewBox="0 0 20 11.8" aria-hidden="true"><path d="M20,1.8l-10,10L0,1.8,1.8,0l8.2,8.2L18.2,0l1.8,1.8Z"/></svg>
              </button>
              <div class="project-row-more-collapse">
                <ul class="project-row-more-list">
                  <li class="more-desc-row"><span class="more-value">${p.description}</span></li>
                  <li class="more-tags-row"><span class="more-label">Tags</span><span class="more-value">${p.tags.join(", ")}</span></li>
                  ${moreFields.map(([label, value]) => `<li><span class="more-label">${label}</span><span class="more-value">${value}</span></li>`).join("")}
                </ul>
              </div>
            </div>
            <!-- solo mobile (vedi mobile.css): le foto del progetto già qui,
                 subito sotto Info, al posto del bottone View Project e
                 della cover — niente pagina di dettaglio separata.
                 Vuota qui apposta: viene riempita solo quando questa
                 scheda diventa quella "corrente" (vedi enterProjectRow più
                 sotto e populateProjectRowGallery) — su desktop questo div
                 resta sempre display:none (vedi CSS) e prima veniva comunque
                 costruito per tutti gli 8 progetti a ogni render, sprecato -->
            <div class="project-row-gallery" data-project="${p.id}"></div>
          </div>
          <button class="btn btn-forward project-row-view-btn" data-project="${p.id}">View Project<svg class="icon-svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="m321-80-71-71 329-329-329-329 71-71 400 400L321-80Z"/></svg></button>
        </div>
        <div class="project-row-image" data-project="${p.id}">Image — replace with yours<br>(${p.name})</div>
      </div>
    `;
    }).join("");

    list.forEach(p=>{
      if(p.cover){
        const img = container.querySelector(`[data-project="${p.id}"] .project-row-image`);
        img.innerHTML = `<img src="${encodePath(p.cover)}" alt="${p.name}" loading="lazy" decoding="async">`;
      }
    });

    container.querySelectorAll(".project-row-view-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> openProject(btn.dataset.project));
    });

    container.querySelectorAll(".project-row-image").forEach(img=>{
      img.addEventListener("click", ()=> openProject(img.dataset.project));
    });

    container.querySelectorAll(".project-row-more-toggle").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const collapse = btn.parentElement.querySelector(".project-row-more-collapse");
        const opening = !collapse.classList.contains("open");
        /* grid-template-rows 0fr->1fr invece di misurare scrollHeight e
           animare max-height: niente lettura sincrona del layout al click
           (che con la galleria inline ora sotto poteva essere pesante, si
           sentiva "a scatti" proprio nell'istante del tap), e la distanza
           percorsa resta comunque quella reale del contenuto — stessa
           velocità percepita indipendentemente dalla lunghezza del testo,
           ma calcolata dal browser durante l'animazione stessa */
        collapse.classList.toggle("open", opening);
        btn.classList.toggle("open", opening);
      });
    });

    /* pallini cliccabili: portano direttamente alla scheda corrispondente.
       Target calcolato con getBoundingClientRect (non offsetTop/Left, che
       dipendono dal più vicino antenato "position"-ato: da quando la lista
       vive dentro .projects-list-wrap, quello non è più necessariamente
       #projects-list stesso) */
    const rows = container.querySelectorAll(".project-row");
    document.querySelectorAll("#project-dots .project-dot").forEach((dot, i)=>{
      dot.addEventListener("click", ()=>{
        const row = rows[i];
        if(!row) return;
        const isMobile = window.matchMedia("(max-width:800px)").matches;
        const containerRect = container.getBoundingClientRect();
        const rowRect = row.getBoundingClientRect();
        dissolveScrollTo(container, isMobile
          ? { left: container.scrollLeft + (rowRect.left - containerRect.left) }
          : { top: container.scrollTop + (rowRect.top - containerRect.top) });
      });
    });
  }


  /* barrette: evidenziano quella corrispondente al progetto corrente.
     Mobile scorre in orizzontale, desktop in verticale (vedi CSS).
     Con lo scroll-snap, l'evento "scroll" può sparare molte volte al
     secondo durante l'inerzia del touch: prima questo handler girava per
     intero (query DOM + matchMedia + forEach) ad ogni singolo tick, anche
     più volte per frame. Il flag scrollTicking lo raggruppa a un massimo
     di un'esecuzione per frame disegnato (via requestAnimationFrame),
     evitando lavoro ridondante proprio mentre l'utente sta scorrendo. */
  let projectDotsTicking = false;
  document.getElementById("projects-list").addEventListener("scroll", ()=>{
    if(projectDotsTicking) return;
    projectDotsTicking = true;
    requestAnimationFrame(()=>{
      const list = document.getElementById("projects-list");
      const dots = document.querySelectorAll("#project-dots .project-dot");
      if(dots.length){
        const isMobile = window.matchMedia("(max-width:800px)").matches;
        const idx = isMobile
          ? (list.clientWidth ? Math.round(list.scrollLeft / list.clientWidth) : 0)
          : (list.clientHeight ? Math.round(list.scrollTop / list.clientHeight) : 0);
        dots.forEach((d,i)=> d.classList.toggle("active", i === idx));
      }
      projectDotsTicking = false;
    });
  });

  /* frecce tastiera: scorrono tra i progetti, solo desktop (mobile usa lo
     swipe/scroll touch nativo) e solo quando il lightbox è chiuso */
  window.addEventListener("keydown", (e)=>{
    if(window.matchMedia("(max-width:800px)").matches) return;
    if(lightbox.classList.contains("active")) return;
    if(!document.querySelector('.view[data-view="projects"]').classList.contains("active")) return;
    if(projectsMode !== "list") return;
    const deltaMap = { ArrowDown:1, ArrowRight:1, ArrowUp:-1, ArrowLeft:-1 };
    const delta = deltaMap[e.key];
    if(delta === undefined) return;
    e.preventDefault();
    const list = document.getElementById("projects-list");
    list.scrollBy({ top: delta * list.clientHeight, behavior:"smooth" });
  });

  /* ============================================================
     RENDER: DETTAGLIO PROGETTO
     ============================================================ */
  let galleryViewMode = "scroll"; // "scroll" | "grid"

  function renderGalleryToggle(){
    const container = document.getElementById("detail-view-toggle");
    container.innerHTML = `
      <button class="filter-btn ${galleryViewMode === "scroll" ? "active" : ""}" data-mode="scroll"><span class="filter-label" data-label="Scroll">Scroll</span></button>
      <button class="filter-btn ${galleryViewMode === "grid" ? "active" : ""}" data-mode="grid"><span class="filter-label" data-label="Grid">Grid</span></button>
    `;
    container.querySelectorAll("[data-mode]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        galleryViewMode = btn.dataset.mode;
        renderGalleryToggle();
        applyGalleryViewMode();
      });
    });
  }

  function applyGalleryViewMode(){
    const gallery = document.getElementById("detail-gallery");
    gallery.classList.toggle("grid-view", galleryViewMode === "grid");
    gallery.classList.toggle("scroll-view", galleryViewMode === "scroll");
    gallery.scrollLeft = 0;
    gallery.scrollTop = 0;
    layoutGridView();
    updateDetailDots();
  }

  /* pallini orizzontali della galleria di dettaglio (solo desktop, Scroll
     view): al posto di indicare una foto precisa (le anteprime non sono a
     tutta larghezza, non c'è uno scroll-snap per singola foto), segnano la
     posizione proporzionale dello scorrimento, come una barra di
     avanzamento */
  function renderDetailDots(count){
    document.getElementById("detail-gallery-dots").innerHTML =
      Array.from({length:count}, (_,i)=> `<span class="detail-dot${i===0?" active":""}"></span>`).join("");
    document.querySelectorAll("#detail-gallery-dots .detail-dot").forEach((dot, i)=>{
      dot.addEventListener("click", ()=>{
        const gallery = document.getElementById("detail-gallery");
        const maxScroll = gallery.scrollWidth - gallery.clientWidth;
        dissolveScrollTo(gallery, { left: count > 1 ? (i / (count - 1)) * maxScroll : 0 });
      });
    });
  }
  function updateDetailDots(){
    const gallery = document.getElementById("detail-gallery");
    const dots = document.querySelectorAll("#detail-gallery-dots .detail-dot");
    if(!dots.length) return;
    const maxScroll = gallery.scrollWidth - gallery.clientWidth;
    const idx = maxScroll > 0 ? Math.round((gallery.scrollLeft / maxScroll) * (dots.length - 1)) : 0;
    dots.forEach((d,i)=> d.classList.toggle("active", i === idx));
  }
  /* stesso raggruppamento per-frame dello scroll di #projects-list qui sopra
     (vedi commento lì): la galleria di dettaglio scorre spesso via inerzia,
     updateDetailDots non deve girare ad ogni singolo tick dell'evento */
  let detailDotsTicking = false;
  document.getElementById("detail-gallery").addEventListener("scroll", ()=>{
    if(detailDotsTicking) return;
    detailDotsTicking = true;
    requestAnimationFrame(()=>{
      updateDetailDots();
      detailDotsTicking = false;
    });
  });

  /* Distribuisce N immagini su 3 righe, il più possibile equilibrate:
     l'eventuale immagine in più va alla riga centrale, le eventuali due in
     più vanno alle righe esterne (simmetrico). Per N=10 dà [3,4,3]. */
  function threeRowCounts(n){
    const base = Math.floor(n / 3);
    const rem = n - base * 3;
    if(rem === 0) return [base, base, base];
    if(rem === 1) return [base, base + 1, base];
    return [base + 1, base, base + 1];
  }

  /* stessa idea di threeRowCounts ma su 2 righe: su tablet lo schermo è
     più stretto, 3 righe (quindi più colonne per riga) darebbe riquadri
     piccoli e poco leggibili — 2 righe più alte restano chiare */
  function twoRowCounts(n){
    const base = Math.floor(n / 2);
    const rem = n - base * 2;
    return rem === 0 ? [base, base] : [base + 1, base];
  }

  /* sceglie il numero di righe della Grid view di dettaglio in base al
     dispositivo: 2 su tablet, 3 su desktop (vedi twoRowCounts/threeRowCounts) */
  function rowCountsForGallery(n){
    return isTabletViewport() ? twoRowCounts(n) : threeRowCounts(n);
  }

  /* Grid statica, senza scorrimento, su 3 righe: stessa dimensione per
     tutte le foto (proporzioni reali 16:9), calcolata per riempire tutto
     lo spazio disponibile tra il menu e il footer. Le righe più corte
     restano centrate invece di stirarsi. */
  function layoutGridView(){
    const gallery = document.getElementById("detail-gallery");
    if(!gallery.classList.contains("grid-view")) return;
    const rows = [...gallery.querySelectorAll(".gallery-row")].filter(r => r.querySelectorAll(".gallery-item-wrap").length);
    if(!rows.length) return;
    const gap = 6;
    const Wc = gallery.clientWidth;
    const Hc = gallery.clientHeight;
    const counts = rows.map(r => r.querySelectorAll(".gallery-item-wrap").length);
    const maxCount = Math.max(...counts);

    const widthCap = (Wc - (maxCount - 1) * gap) / maxCount;
    const heightCap = ((Hc - (rows.length - 1) * gap) / rows.length) * 16 / 9;
    const tileW = Math.max(0, Math.min(widthCap, heightCap));

    gallery.style.setProperty("--tile-w", tileW + "px");
  }
  window.addEventListener("resize", ()=>{
    clearTimeout(window.__gridResizeTimer);
    window.__gridResizeTimer = setTimeout(layoutGridView, 120);
  });

  /* ricostruisce l'indice a griglia dei progetti quando si passa da un
     "bucket" di larghezza all'altro (mobile/tablet/desktop) — capita
     soprattutto ruotando un iPad tra portrait e landscape a sito già
     aperto sull'indice progetti: senza questo, --index-grid-cols/rows
     resterebbero quelli calcolati all'apertura, sbagliati per il nuovo
     orientamento */
  let lastViewportBucket = viewportBucket();
  window.addEventListener("resize", ()=>{
    clearTimeout(window.__bucketResizeTimer);
    window.__bucketResizeTimer = setTimeout(()=>{
      const bucket = viewportBucket();
      if(bucket === lastViewportBucket) return;
      lastViewportBucket = bucket;
      if(projectsListReady && document.getElementById("view-projects").classList.contains("grid-mode")){
        const list = PROJECTS.filter(p => activeFilter === "all" || p.categories.includes(activeFilter));
        renderProjectsIndexGrid(list);
      }
    }, 150);
  });

  /* ============================================================
     LIGHTBOX
     ============================================================ */
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxVideo = document.getElementById("lightbox-video");
  const lightboxCaption = document.getElementById("lightbox-caption");
  const lightboxDots = document.getElementById("lightbox-dots");
  const lightboxClose = document.getElementById("lightbox-close");

  /* elenco ordinato delle foto/video della galleria aperta, per poter
     scorrere avanti/indietro con le frecce della tastiera una volta aperto
     il lightbox (ricostruito a ogni openProject, vedi sotto) */
  let lightboxItems = [];
  let lightboxIndex = -1;

  /* barrette di paginazione: solo mobile (vedi mobile.css), stessa idea di
     .project-dots nella lista progetti ma con classi proprie (colori e
     dimensioni diversi, vedi mobile.css) */
  function renderLightboxDots(){
    lightboxDots.innerHTML = lightboxItems.map((_, i) =>
      `<span class="lightbox-dot${i === lightboxIndex ? " active" : ""}"></span>`
    ).join("");
    lightboxDots.querySelectorAll(".lightbox-dot").forEach((dot, i)=>{
      dot.addEventListener("click", (e)=>{
        /* senza stopPropagation il click risalirebbe fino a .lightbox e
           chiuderebbe il lightbox invece di limitarsi a cambiare foto */
        e.stopPropagation();
        openLightbox(i);
      });
    });
  }

  function openLightbox(index){
    const item = lightboxItems[index];
    if(!item) return;
    lightboxIndex = index;
    const { src, caption } = item;
    if(isVideo(src)){
      lightboxImg.style.display = "none";
      lightboxImg.src = "";
      lightboxVideo.style.display = "block";
      lightboxVideo.src = encodePath(src);
      lightboxVideo.play();
    } else {
      lightboxVideo.style.display = "none";
      lightboxVideo.pause();
      lightboxVideo.src = "";
      lightboxImg.style.display = "block";
      lightboxImg.src = encodePath(src);
      lightboxImg.alt = caption;
    }
    lightboxCaption.textContent = caption;
    renderLightboxDots();
    lightbox.classList.add("active");
  }
  function closeLightbox(){
    lightbox.classList.remove("active");
    lightboxImg.src = "";
    lightboxVideo.pause();
    lightboxVideo.src = "";
  }
  lightboxClose.addEventListener("click", (e)=>{
    /* senza stopPropagation il click risalirebbe fino a .lightbox, che
       chiuderebbe comunque — ma è più corretto che sia la X stessa a farlo,
       non un evento che "passa attraverso" */
    e.stopPropagation();
    closeLightbox();
  });
  function stepLightbox(delta){
    if(!lightboxItems.length) return;
    const next = (lightboxIndex + delta + lightboxItems.length) % lightboxItems.length;
    openLightbox(next);
  }
  window.addEventListener("keydown", (e)=>{
    if(!lightbox.classList.contains("active")) return;
    if(e.key === "Escape") closeLightbox();
    else if(e.key === "ArrowRight") stepLightbox(1);
    else if(e.key === "ArrowLeft") stepLightbox(-1);
  });

  /* rotella del mouse (o trackpad): avanti/indietro tra le foto come le
     frecce, non uno scorrimento continuo — non c'è nulla da scorrere qui,
     è una foto alla volta. L'ascoltatore è su .lightbox stesso (non su
     window): mentre il lightbox è chiuso è display:none e non riceve mai
     l'evento, quindi non serve nemmeno controllare "active" a mano né si
     rischia di bloccare lo scroll della pagina sotto */
  let lightboxWheelLock = false;
  lightbox.addEventListener("wheel", (e)=>{
    e.preventDefault();
    if(lightboxWheelLock) return;
    /* trackpad e rotelle "a step" mandano tanti eventi piccoli per un solo
       gesto: sotto una soglia minima li ignora, altrimenti un singolo
       scroll salterebbe più foto invece di una */
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(Math.abs(delta) < 8) return;
    stepLightbox(delta > 0 ? 1 : -1);
    lightboxWheelLock = true;
    setTimeout(()=>{ lightboxWheelLock = false; }, 380);
  }, { passive:false });

  /* swipe col dito (mobile): scorre tra le foto invece di chiudere il
     lightbox, che resta chiudibile con un tap semplice (senza spostamento) */
  const SWIPE_THRESHOLD = 40; // px
  let touchStartX = 0, touchStartY = 0, wasSwipe = false;

  lightbox.addEventListener("touchstart", (e)=>{
    if(e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    wasSwipe = false;
  }, { passive:true });

  lightbox.addEventListener("touchmove", (e)=>{
    /* evita che lo swipe venga interpretato anche come scroll/gesture di
       navigazione del browser sotto al lightbox (che è comunque a schermo
       intero e non ha nulla da scorrere) */
    e.preventDefault();
  }, { passive:false });

  lightbox.addEventListener("touchend", (e)=>{
    if(e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)){
      wasSwipe = true;
      stepLightbox(dx < 0 ? 1 : -1);
    }
  });

  lightbox.addEventListener("click", ()=>{
    /* un tap genera comunque un evento "click": se era invece uno swipe
       (rilevato in touchend) non va chiuso il lightbox */
    if(wasSwipe){ wasSwipe = false; return; }
    closeLightbox();
  });

  /* markup delle foto/video di un progetto (un .gallery-item-wrap per
     immagine, con placeholder per gli slot vuoti): condiviso tra la
     galleria di #view-detail (openProject, sotto) e la galleria inline
     dentro ogni .project-row su mobile (vedi renderProjectsList) */
  function buildGalleryItemsHtml(project){
    const images = project.images && project.images.length ? project.images : [null, null, null, null];
    return images.map((image, i) => {
      if(image){
        const caption = image.caption || "";
        const media = isVideo(image.src)
          ? `<video src="${encodePath(image.src)}" loop muted playsinline preload="none" data-lazy-video></video>`
          : `<img src="${encodePath(image.src)}" alt="${project.name} — ${caption || ("image " + (i+1))}" loading="lazy" decoding="async">`;
        return `
          <div class="gallery-item-wrap">
            <div class="gallery-item" data-src="${image.src}" data-caption="${caption}">
              ${media}
            </div>
          </div>`;
      }
      return `
        <div class="gallery-item-wrap">
          <div class="gallery-item">Image ${i+1} — replace with yours<br>(${project.name})</div>
        </div>`;
    });
  }

  function openProject(id, pushState = true){
    const project = PROJECTS.find(p => p.id === id);
    if(!project) return;

    galleryViewMode = "scroll"; /* ogni progetto riparte dalla vista Scroll, indipendentemente da cosa si era scelto prima */

    document.getElementById("detail-title").textContent = project.name;
    /* letto da currentNavState per salvare/ricostruire la cronologia:
       senza, i tasti avanti/indietro del browser tra due progetti diversi
       (stesso "#detail") non saprebbero più quale dei due mostrare */
    document.getElementById("view-detail").dataset.project = id;

    const gallery = document.getElementById("detail-gallery");
    const itemsHtml = buildGalleryItemsHtml(project);
    /* in Grid view le immagini si dispongono su 3 righe (vedi threeRowCounts);
       in Scroll view i gruppi-riga diventano trasparenti (display:contents)
       e l'ordine resta quello originale, invariato. */
    const rowCounts = rowCountsForGallery(itemsHtml.length);
    let cursor = 0;
    gallery.innerHTML = rowCounts.map(count => {
      const rowHtml = itemsHtml.slice(cursor, cursor + count).join("");
      cursor += count;
      return `<div class="gallery-row">${rowHtml}</div>`;
    }).join("");

    observeLazyVideos(gallery);

    const lightboxTriggers = gallery.querySelectorAll(".gallery-item[data-src]");
    lightboxItems = [...lightboxTriggers].map(item => ({ src: item.dataset.src, caption: item.dataset.caption }));
    lightboxTriggers.forEach((item, i)=>{
      item.addEventListener("click", ()=> openLightbox(i));
    });

    renderDetailDots(itemsHtml.length);
    renderGalleryToggle();
    applyGalleryViewMode();

    gallery.onwheel = (e) => {
      if(galleryViewMode !== "scroll") return;
      if(window.matchMedia("(max-width:800px)").matches) return;
      if(e.deltaY !== 0){
        e.preventDefault();
        gallery.scrollLeft += e.deltaY;
      }
    };

    if(pushState){
      navigate("detail");
    } else {
      /* ricostruzione da popstate: la cronologia va lasciata intatta,
         non ne va creata una nuova voce */
      showView("detail", true);
    }
    /* il reset va rifatto DOPO showView/navigate: prima di questo punto
       #view-detail è ancora display:none, e scrollLeft/scrollTop su un
       elemento nascosto non hanno alcun effetto (la vecchia posizione di
       scroll resterebbe) */
    gallery.scrollTo({top:0, left:0, behavior:"instant"});
    /* su iOS lo scroll momentum del touch può restare "in volo" e sovrascrivere
       questo reset un istante dopo: un secondo reset al frame successivo lo
       annulla comunque */
    requestAnimationFrame(()=>{ gallery.scrollTop = 0; gallery.scrollLeft = 0; });
  }

  /* niente salvataggio/copia delle foto: blocca il menu contestuale (tasto
     destro/tocco prolungato) e il trascinamento fuori dalla pagina su
     qualsiasi immagine o video, ovunque nel sito */
  document.addEventListener("contextmenu", (e)=>{
    if(e.target.tagName === "IMG" || e.target.tagName === "VIDEO") e.preventDefault();
  });
  document.addEventListener("dragstart", (e)=>{
    if(e.target.tagName === "IMG" || e.target.tagName === "VIDEO") e.preventDefault();
  });

  /* ============================================================
     INIT
     ============================================================ */
  renderFooter();
  renderFilters();
  applyProjectsMode();

  document.querySelector(".view.active").classList.add("visible");
  if(location.hash){
    history.replaceState({view:"home"}, "", location.pathname);
  }

  /* About e, soprattutto, Projects (fino a 80 foto/video nelle gallerie
     inline mobile) sono le parti più pesanti da costruire. Farlo qui in
     modo sincrono, prima ancora che la pagina diventi interattiva,
     blocca il thread principale proprio mentre la schermata di
     caricamento è a schermo — su un telefono lento il tap su
     "click to enter" può restare in coda finché quel lavoro non finisce,
     e il passaggio sembra scattare in ritardo. Rimandarle al frame
     successivo lascia che il browser disegni prima la pagina e la renda
     subito reattiva al tocco; il contenuto arriva comunque un istante
     dopo, ben prima che serva davvero (l'utente deve ancora leggere/
     cliccare la schermata di caricamento). */
  /* About e Projects sono le parti più pesanti da costruire, ma non hanno
     lo stesso peso: About è quattro assegnazioni di testo (nome, bio,
     skill, contatti), Projects costruisce 8 schede intere (testo, tag,
     copertine, listener) — molto più leggero di prima (le gallerie restano
     vuote finché non apri un progetto, vedi enterProjectRow più sopra), ma
     comunque il pezzo più corposo del sito.
     Se stessero nello stesso frame, proprio mentre il nome/bio/foto
     compaiono in home partirebbe anche la costruzione di tutte le schede
     progetto — la home "scatterebbe" un istante dopo essere apparsa. Con
     due requestAnimationFrame annidati, About (leggerissimo) va nel primo
     frame utile — il nome/bio in home compaiono senza nient'altro di
     pesante appeso alla stessa esecuzione — e Projects slitta a un frame
     ancora dopo: ~16ms in più, impercettibili, ma la home non condivide
     più il colpo di lavoro con quello scatto */
  requestAnimationFrame(()=>{
    renderAbout();
    requestAnimationFrame(()=>{
      renderProjectsList();
      projectsListReady = true;
    });
  });

</script>
</body>
</html>
